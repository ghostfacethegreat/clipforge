name: SoloDesk browser acceptance

on:
  pull_request:
    paths:
      - "solodesk/**"
      - ".github/workflows/solodesk-browser.yml"
  push:
    paths:
      - "solodesk/**"
      - ".github/workflows/solodesk-browser.yml"

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solodesk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned browser-test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.65.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser acceptance tests
        run: npx playwright test
