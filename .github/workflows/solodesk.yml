name: SoloDesk checks

on:
  pull_request:
    paths:
      - "solodesk/**"
      - ".github/workflows/solodesk.yml"
  push:
    paths:
      - "solodesk/**"
      - ".github/workflows/solodesk.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solodesk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run dependency-free unit tests
        run: npm test
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check core.js
      - name: Check static app shell
        run: |
          test -s index.html
          test -s styles.css
          test -s manifest.webmanifest
          test -s sw.js
          test -s README.md

  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solodesk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned browser-test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.65.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser acceptance tests
        run: npx playwright test
