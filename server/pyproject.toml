[project]
name = "clipforge-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.8",
    "httpx>=0.27",
    "requests>=2.31",
    "faster-whisper==1.0.3",
    "av==12.3.0",
    "Pillow>=10.4",
    "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
face-detection = ["opencv-python-headless>=4.10"]
dev = ["pytest>=8.0"]
